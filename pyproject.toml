[project]
name = "finance-ai-workbench"
version = "0.1.0"
description = "Frank 的个人工作台"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "python-multipart>=0.0.20,<1",
  "mcp>=1.9,<2",
]

[project.optional-dependencies]
mac = [
  "exchangelib>=5.6,<6",
  "frida>=17,<18",
  "mlx-whisper>=0.4,<1",
  "pycryptodome>=3.23,<4",
  "silk-python>=0.2,<1",
  "zstandard>=0.23,<1",
]
test = [
  "httpx>=0.27,<1",
  "pytest>=8,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]
exclude = ["data*", "deploy*", "outputs*", "tests*", "work*"]
